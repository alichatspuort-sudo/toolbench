<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word &amp; Character Counter — ToolBench</title>
<meta name="description" content="Free live word counter, character counter, sentence counter, and reading time estimator.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <div class="row">
      <div class="brand"><span class="chip"></span>Tool<span>Bench</span></div>
      <nav class="sitenav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="tool-page-head">
    <span class="tag-badge">Text</span>
    <h1>Word &amp; Character Counter</h1>
    <p class="lead">Paste or type your text below — counts update live as you type.</p>
  </div>

  <div class="panel">
    <div class="field">
      <label for="textInput">Your text</label>
      <textarea id="textInput" rows="10" placeholder="Start typing or paste your text here..."></textarea>
    </div>
    <div class="stat-row">
      <div class="stat-box"><div class="num" id="wordCount">0</div><div class="lbl">Words</div></div>
      <div class="stat-box"><div class="num" id="charCount">0</div><div class="lbl">Characters</div></div>
      <div class="stat-box"><div class="num" id="charNoSpace">0</div><div class="lbl">No spaces</div></div>
      <div class="stat-box"><div class="num" id="sentenceCount">0</div><div class="lbl">Sentences</div></div>
      <div class="stat-box"><div class="num" id="readTime">0 min</div><div class="lbl">Reading time</div></div>
    </div>
  </div>
</main>

<footer class="wrap">
  <span>&copy; 2026 ToolBench.</span>
  <span><a href="about.html">About</a> · <a href="privacy.html">Privacy Policy</a> · <a href="disclaimer.html">Disclaimer</a> · <a href="contact.html">Contact</a></span>
</footer>

<script>
  const textInput = document.getElementById('textInput');

  function update(){
    const text = textInput.value;
    const trimmed = text.trim();
    const words = trimmed.length ? trimmed.split(/\s+/).length : 0;
    const chars = text.length;
    const charsNoSpace = text.replace(/\s/g, '').length;
    const sentences = trimmed.length ? (trimmed.match(/[.!?]+(\s|$)/g) || []).length || (trimmed ? 1 : 0) : 0;
    const readMinutes = Math.max(1, Math.ceil(words / 200));

    document.getElementById('wordCount').textContent = words;
    document.getElementById('charCount').textContent = chars;
    document.getElementById('charNoSpace').textContent = charsNoSpace;
    document.getElementById('sentenceCount').textContent = sentences;
    document.getElementById('readTime').textContent = words ? `${readMinutes} min` : '0 min';
  }

  textInput.addEventListener('input', update);
  update();
</script>
</body>
</html>
