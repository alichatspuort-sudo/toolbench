<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Converter — ToolBench</title>
<meta name="description" content="Convert length, weight, temperature, volume, and area units instantly, free.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <div class="row">
      <div class="brand"><span class="chip"></span>Tool<span>Bench</span></div>
      <nav class="sitenav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="tool-page-head">
    <span class="tag-badge">Conversion</span>
    <h1>Unit Converter</h1>
    <p class="lead">Convert between length, weight, temperature, volume, and area units, all on one page.</p>
  </div>

  <div class="panel">
    <div class="field">
      <label for="category">Category</label>
      <select id="category">
        <option value="length">Length</option>
        <option value="weight">Weight</option>
        <option value="temperature">Temperature</option>
        <option value="volume">Volume</option>
        <option value="area">Area</option>
      </select>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="fromVal">From</label>
        <input type="number" id="fromVal" value="1">
        <select id="fromUnit" style="margin-top:8px;"></select>
      </div>
      <div class="field">
        <label for="toUnit">To</label>
        <input type="text" id="toVal" readonly>
        <select id="toUnit" style="margin-top:8px;"></select>
      </div>
    </div>

    <button class="btn secondary" id="swapBtn" type="button">Swap units</button>

    <div class="result-box" style="margin-top:18px;">
      <div class="result-label">Result</div>
      <span id="resultText">1 meter = 1 meter</span>
    </div>
  </div>
</main>

<footer class="wrap">
  <span>&copy; 2026 ToolBench.</span>
  <span><a href="about.html">About</a> · <a href="privacy.html">Privacy Policy</a> · <a href="disclaimer.html">Disclaimer</a> · <a href="contact.html">Contact</a></span>
</footer>

<script>
  const UNITS = {
    length: { base: 'meter', units: {
      meter: 1, kilometer: 1000, centimeter: 0.01, millimeter: 0.001,
      mile: 1609.344, yard: 0.9144, foot: 0.3048, inch: 0.0254
    }},
    weight: { base: 'kilogram', units: {
      kilogram: 1, gram: 0.001, milligram: 0.000001,
      pound: 0.45359237, ounce: 0.028349523125, ton: 1000
    }},
    volume: { base: 'liter', units: {
      liter: 1, milliliter: 0.001, gallon: 3.785411784,
      quart: 0.946352946, cup: 0.24, tablespoon: 0.0147868, teaspoon: 0.00492892
    }},
    area: { base: 'square meter', units: {
      'square meter': 1, 'square kilometer': 1000000, 'square foot': 0.092903,
      'square yard': 0.836127, acre: 4046.8564224, hectare: 10000
    }},
    temperature: { base: 'celsius', units: { celsius: null, fahrenheit: null, kelvin: null } }
  };

  const categoryEl = document.getElementById('category');
  const fromValEl = document.getElementById('fromVal');
  const toValEl = document.getElementById('toVal');
  const fromUnitEl = document.getElementById('fromUnit');
  const toUnitEl = document.getElementById('toUnit');
  const resultText = document.getElementById('resultText');

  function populateUnits(){
    const cat = categoryEl.value;
    const unitNames = Object.keys(UNITS[cat].units);
    fromUnitEl.innerHTML = unitNames.map(u => `<option value="${u}">${u}</option>`).join('');
    toUnitEl.innerHTML = unitNames.map(u => `<option value="${u}">${u}</option>`).join('');
    toUnitEl.selectedIndex = unitNames.length > 1 ? 1 : 0;
    convert();
  }

  function convertTemperature(value, from, to){
    let celsius;
    if (from === 'celsius') celsius = value;
    else if (from === 'fahrenheit') celsius = (value - 32) * 5/9;
    else if (from === 'kelvin') celsius = value - 273.15;

    if (to === 'celsius') return celsius;
    if (to === 'fahrenheit') return celsius * 9/5 + 32;
    if (to === 'kelvin') return celsius + 273.15;
  }

  function convert(){
    const cat = categoryEl.value;
    const from = fromUnitEl.value;
    const to = toUnitEl.value;
    const val = parseFloat(fromValEl.value) || 0;
    let result;

    if (cat === 'temperature'){
      result = convertTemperature(val, from, to);
    } else {
      const baseVal = val * UNITS[cat].units[from];
      result = baseVal / UNITS[cat].units[to];
    }

    const rounded = Math.round(result * 100000) / 100000;
    toValEl.value = rounded;
    resultText.textContent = `${val} ${from} = ${rounded} ${to}`;
  }

  categoryEl.addEventListener('change', populateUnits);
  fromValEl.addEventListener('input', convert);
  fromUnitEl.addEventListener('change', convert);
  toUnitEl.addEventListener('change', convert);
  document.getElementById('swapBtn').addEventListener('click', () => {
    const f = fromUnitEl.value;
    fromUnitEl.value = toUnitEl.value;
    toUnitEl.value = f;
    convert();
  });

  populateUnits();
</script>
</body>
</html>
