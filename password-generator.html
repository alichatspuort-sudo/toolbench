<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator — ToolBench</title>
<meta name="description" content="Generate strong, random passwords for free, right in your browser.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <div class="row">
      <div class="brand"><span class="chip"></span>Tool<span>Bench</span></div>
      <nav class="sitenav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="tool-page-head">
    <span class="tag-badge">Security</span>
    <h1>Password Generator</h1>
    <p class="lead">Passwords are generated locally in your browser and never sent anywhere.</p>
  </div>

  <div class="panel">
    <div class="result-box" style="font-size:1.3rem; display:flex; justify-content:space-between; align-items:center; gap:12px;">
      <span id="pwOutput">Click Generate</span>
      <button class="btn secondary" id="copyBtn" type="button" style="flex-shrink:0;">Copy</button>
    </div>

    <div class="field" style="margin-top:22px;">
      <label for="lengthRange">Length: <span id="lengthLabel">16</span></label>
      <input type="range" id="lengthRange" min="6" max="48" value="16" style="width:100%;">
    </div>

    <div class="field-row">
      <div class="field"><label><input type="checkbox" id="optUpper" checked> Uppercase (A-Z)</label></div>
      <div class="field"><label><input type="checkbox" id="optLower" checked> Lowercase (a-z)</label></div>
      <div class="field"><label><input type="checkbox" id="optNumbers" checked> Numbers (0-9)</label></div>
      <div class="field"><label><input type="checkbox" id="optSymbols" checked> Symbols (!@#$)</label></div>
    </div>

    <button class="btn" id="generateBtn" type="button">Generate Password</button>
  </div>
</main>

<footer class="wrap">
  <span>&copy; 2026 ToolBench.</span>
  <span><a href="about.html">About</a> · <a href="privacy.html">Privacy Policy</a> · <a href="disclaimer.html">Disclaimer</a> · <a href="contact.html">Contact</a></span>
</footer>

<script>
  const CHARSETS = {
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    lower: 'abcdefghijklmnopqrstuvwxyz',
    numbers: '0123456789',
    symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
  };

  const lengthRange = document.getElementById('lengthRange');
  const lengthLabel = document.getElementById('lengthLabel');
  const pwOutput = document.getElementById('pwOutput');

  lengthRange.addEventListener('input', () => lengthLabel.textContent = lengthRange.value);

  function generatePassword(){
    let pool = '';
    if (document.getElementById('optUpper').checked) pool += CHARSETS.upper;
    if (document.getElementById('optLower').checked) pool += CHARSETS.lower;
    if (document.getElementById('optNumbers').checked) pool += CHARSETS.numbers;
    if (document.getElementById('optSymbols').checked) pool += CHARSETS.symbols;

    if (!pool){
      pwOutput.textContent = 'Select at least one character type';
      return;
    }

    const length = parseInt(lengthRange.value, 10);
    const randomValues = new Uint32Array(length);
    crypto.getRandomValues(randomValues);
    let result = '';
    for (let i = 0; i < length; i++){
      result += pool[randomValues[i] % pool.length];
    }
    pwOutput.textContent = result;
  }

  document.getElementById('generateBtn').addEventListener('click', generatePassword);
  document.getElementById('copyBtn').addEventListener('click', () => {
    const text = pwOutput.textContent;
    if (text && text !== 'Click Generate'){
      navigator.clipboard.writeText(text);
      const btn = document.getElementById('copyBtn');
      const original = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = original, 1200);
    }
  });

  generatePassword();
</script>
</body>
</html>
