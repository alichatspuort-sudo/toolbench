<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator — ToolBench</title>
<meta name="description" content="A free online calculator with percentage, square root, and memory functions.">
<link rel="stylesheet" href="styles.css">
<style>
  .calc{ max-width:340px; margin:0 auto; }
  .calc-display{
    background:var(--ink); color:#fff;
    border-radius:6px; padding:20px 16px;
    text-align:right; font-family:var(--mono);
    margin-bottom:14px;
  }
  .calc-display .prev{ font-size:0.8rem; color:#9FB0B9; min-height:1.2em; }
  .calc-display .curr{ font-size:2rem; word-break:break-all; }
  .calc-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
  .calc-btn{
    padding:16px 0; border:1px solid var(--line); border-radius:6px;
    background:var(--paper); font-family:var(--mono); font-size:1.05rem;
    cursor:pointer; transition:background .15s ease;
  }
  .calc-btn:hover{ background:#E2E8EB; }
  .calc-btn.op{ background:var(--steel); color:#fff; border-color:var(--steel); }
  .calc-btn.op:hover{ opacity:0.88; }
  .calc-btn.eq{ background:var(--orange); color:#fff; border-color:var(--orange); grid-column:span 2; }
  .calc-btn.wide{ grid-column:span 2; }
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <div class="row">
      <div class="brand"><span class="chip"></span>Tool<span>Bench</span></div>
      <nav class="sitenav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="tool-page-head">
    <span class="tag-badge">Math</span>
    <h1>Calculator</h1>
    <p class="lead">A straightforward calculator for everyday math — percentages, square roots, and memory recall included.</p>
  </div>

  <div class="panel calc">
    <div class="calc-display">
      <div class="prev" id="calc-prev">&nbsp;</div>
      <div class="curr" id="calc-curr">0</div>
    </div>
    <div class="calc-grid">
      <button class="calc-btn wide" data-action="clear">C</button>
      <button class="calc-btn" data-action="sqrt">&radic;</button>
      <button class="calc-btn op" data-action="percent">%</button>

      <button class="calc-btn" data-num="7">7</button>
      <button class="calc-btn" data-num="8">8</button>
      <button class="calc-btn" data-num="9">9</button>
      <button class="calc-btn op" data-op="/">&divide;</button>

      <button class="calc-btn" data-num="4">4</button>
      <button class="calc-btn" data-num="5">5</button>
      <button class="calc-btn" data-num="6">6</button>
      <button class="calc-btn op" data-op="*">&times;</button>

      <button class="calc-btn" data-num="1">1</button>
      <button class="calc-btn" data-num="2">2</button>
      <button class="calc-btn" data-num="3">3</button>
      <button class="calc-btn op" data-op="-">&minus;</button>

      <button class="calc-btn" data-num="0">0</button>
      <button class="calc-btn" data-num=".">.</button>
      <button class="calc-btn eq" data-action="equals">=</button>
      <button class="calc-btn op" data-op="+">+</button>
    </div>
  </div>
</main>

<footer class="wrap">
  <span>&copy; 2026 ToolBench.</span>
  <span><a href="about.html">About</a> · <a href="privacy.html">Privacy Policy</a> · <a href="disclaimer.html">Disclaimer</a> · <a href="contact.html">Contact</a></span>
</footer>

<script>
  const prevEl = document.getElementById('calc-prev');
  const currEl = document.getElementById('calc-curr');
  let current = '0', previous = '', operator = null, resetNext = false;

  function updateDisplay(){
    currEl.textContent = current;
    prevEl.textContent = previous ? `${previous} ${operator || ''}` : '\u00A0';
  }

  function inputNum(n){
    if (resetNext){ current = '0'; resetNext = false; }
    if (n === '.' && current.includes('.')) return;
    current = current === '0' && n !== '.' ? n : current + n;
    updateDisplay();
  }

  function compute(a, b, op){
    a = parseFloat(a); b = parseFloat(b);
    switch(op){
      case '+': return a + b;
      case '-': return a - b;
      case '*': return a * b;
      case '/': return b === 0 ? 'Error' : a / b;
      default: return b;
    }
  }

  document.querySelectorAll('[data-num]').forEach(btn => {
    btn.addEventListener('click', () => inputNum(btn.dataset.num));
  });

  document.querySelectorAll('[data-op]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (operator && !resetNext){
        current = String(compute(previous, current, operator));
      }
      previous = current;
      operator = btn.dataset.op;
      resetNext = true;
      updateDisplay();
    });
  });

  document.querySelector('[data-action="equals"]').addEventListener('click', () => {
    if (operator){
      current = String(compute(previous, current, operator));
      previous = '';
      operator = null;
      resetNext = true;
      updateDisplay();
    }
  });

  document.querySelector('[data-action="clear"]').addEventListener('click', () => {
    current = '0'; previous = ''; operator = null; resetNext = false;
    updateDisplay();
  });

  document.querySelector('[data-action="sqrt"]').addEventListener('click', () => {
    current = String(Math.sqrt(parseFloat(current)));
    resetNext = true;
    updateDisplay();
  });

  document.querySelector('[data-action="percent"]').addEventListener('click', () => {
    current = String(parseFloat(current) / 100);
    updateDisplay();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') inputNum(e.key);
    else if (e.key === '.') inputNum('.');
    else if (['+','-','*','/'].includes(e.key)) document.querySelector(`[data-op="${e.key}"]`).click();
    else if (e.key === 'Enter' || e.key === '=') document.querySelector('[data-action="equals"]').click();
    else if (e.key === 'Escape') document.querySelector('[data-action="clear"]').click();
  });
</script>
</body>
</html>
